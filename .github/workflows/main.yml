name: Build APK

on:
  push:
    paths-ignore:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: AqrabMasjid-apk
          path: app/build/outputs/apk/debug/*.apk

      # Fixed download link for phones (no sign-in, no zip):
      # https://github.com/gomshoa-blip/AqrabMasjid/releases/download/latest-apk/AqrabMasjid.apk
      - name: Copy APK with a fixed name
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/*.apk AqrabMasjid.apk

      - name: Publish APK download link
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "أقرب مسجد - آخر نسخة"
          body: "Latest test build. Built from ${{ github.sha }} (run ${{ github.run_number }})."
          prerelease: true
          files: AqrabMasjid.apk

      # Google Play build (.aab). Runs only after you add the 4 secrets in
      # GitHub: Settings > Secrets and variables > Actions.
      - name: Build for Google Play (AAB)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --stacktrace

      - name: Upload the Google Play file
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AqrabMasjid-googleplay-aab
          path: app/build/outputs/bundle/release/*.aab
