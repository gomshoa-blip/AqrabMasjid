  {ar:"مقبرة شمال الرياض", en:"North Riyadh Cemetery", har:"حي العارض – شمال الرياض", hen:"Al Aarid – North Riyadh", rt:4.5, rc:457, lat:24.9388248, lng:46.5924456, id:"ChIJDfTBCfzrLj4R3otK0vOh_hM"},
  {ar:"مقبرة عرقة", en:"Irqah Cemetery", har:"حي عرقة", hen:"Irqah", rt:5.0, rc:27, lat:24.6873877, lng:46.6097699, id:"ChIJTwQezssdLz4RFE726Xnzqhw"},
  {ar:"مقبرة منفوحة", en:"Manfouha Cemetery", har:"حي المصانع", hen:"Al Masani'", rt:4.6, rc:10, lat:24.5846881, lng:46.7266965, id:"ChIJq6qqWhYPLz4RJ4FKm5_Gj2E"},
  {ar:"مقبرة جنوب الرياض", en:"South Riyadh Cemetery", har:"حي المنصورية – جنوب الرياض", hen:"Al Mansuriyah – South Riyadh", rt:4.5, rc:81, lat:24.5153686, lng:46.8037514, id:"ChIJo5nZFRILLz4RiyZRAqyJt_A"}
];

let me = null, lang = "ar", statusKey = "";
try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ar") lang = s; } catch(_){}
if (location.hash === "#en") lang = "en";
if (location.hash === "#ar") lang = "ar";

const statusEl = document.getElementById("status");
function km(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function dirUrl(m){return "https://www.google.com/maps/dir/?api=1&destination="+m.lat+","+m.lng+
  "&destination_place_id="+m.id+"&travelmode=driving";}

function fill(el, data){
  const L = T[lang];
  let rows = data.map(m => ({...m, d: me ? km(me[0],me[1],m.lat,m.lng) : null}));
  if (me) rows.sort((a,b)=>a.d-b.d);
  el.innerHTML = rows.map((m,i)=>`
    <div class="card ${me&&i===0?'first':''}">
      <div class="info">
        ${me&&i===0?`<span class="tag">${L.nearest}</span><br>`:''}
        <h3>${m[lang]}</h3>
        <div class="meta">📍 ${lang==="ar"?m.har:m.hen}${m.d!=null?`<span class="dist">${m.d.toFixed(1)} ${L.km}</span>`:''}</div>
        <div class="meta">${m.rt?L.rating(m.rt.toFixed(1), m.rc):L.noRating}</div>
      </div>
      <a class="go" href="${dirUrl(m)}" target="_blank" rel="noopener">${L.go}</a>
    </div>`).join("");
}

function apply(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = L[e.dataset.t] || ""; });
  document.querySelectorAll("[data-t=duaEn],[data-t=visitEn]").forEach(e => e.style.display = lang==="en" ? "block" : "none");
  document.getElementById("langBtn").textContent = L.other;
  statusEl.textContent = statusKey ? L[statusKey] : "";
  document.getElementById("waBtn").href = "https://wa.me/?text=" + encodeURIComponent(L.waMsg);
  fill(document.getElementById("list"), M);
  fill(document.getElementById("graves"), G);
}

document.getElementById("langBtn").addEventListener("click", ()=>{
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch(_){}
  apply();
});

document.getElementById("near").addEventListener("click", ()=>{
  statusKey = "locating"; apply();
  const fail = ()=>{ statusKey = "fail"; apply(); };
  try{
    if(!navigator.geolocation) throw 0;
    navigator.geolocation.getCurrentPosition(p=>{
      me=[p.coords.latitude,p.coords.longitude];
      statusKey = "sorted"; apply();
    }, fail, {enableHighAccuracy:true,timeout:8000});
  }catch(_){ fail(); }
});


// ===== Install as app =====
let deferred = null;
const instBtn = document.getElementById("instBtn"), modal = document.getElementById("modal");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if (standalone) instBtn.style.display = "none";
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
addEventListener("appinstalled", () => { instBtn.style.display = "none"; deferred = null; });
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const inApp = /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|Twitter|WhatsApp/i.test(ua);
const isAndroid = /Android/i.test(ua);
function showSteps(key){
  document.getElementById("steps").innerHTML = T[lang][key].map(x=>`<li>${x}</li>`).join("");
  modal.hidden = false;
}
instBtn.addEventListener("click", async ()=>{
  if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch(_){} deferred = null; return; }
  if (inApp) return showSteps("inAppSteps");
  if (isIOS) return showSteps("iosSteps");
  if (isAndroid) return showSteps("andSteps");
  showSteps("pcSteps");
});
document.getElementById("closeM").addEventListener("click", ()=> modal.hidden = true);
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/sw.js").catch(()=>{}); } catch(_){} }

apply();
document.title = lang==="ar" ? "قيراط – جنائز الرياض" : "Qirat – Riyadh Funerals";
</script>
<script>
document.addEventListener("click", e => {
  const el = e.target.closest("#goNearest,#waBtn,#instBtn,#instTop,#near,.go");
  if (!el || !window.gtag) return;
  const name = {goNearest:"nearest_mosque_click", waBtn:"whatsapp_share", instBtn:"install_click", instTop:"install_click", near:"show_nearest_click"}[el.id] || "directions_click";
  gtag("event", name);
});
</script>
