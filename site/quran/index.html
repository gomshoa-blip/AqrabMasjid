<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>/* Old link (pages.dev): go to the new link */(function(){if(/\.pages\.dev$/.test(location.hostname)){var q=location.search;location.replace("https://masjid.gomshoa.com"+location.pathname+(q?q+"&":"?")+"moved=1"+location.hash);}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EC">
<title>المصحف – أقرب مسجد</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root{--paper:#FBF7EC;--ink:#1b1b1b;--green:#0F6B4F;--gold:#C9A227;--line:#e4dcc5;--frame:#fff8e2;--soft:#7a6a3f;--btn:#DCEEE5;--btnt:#0A4A37;--panel:#fff}
  html[data-theme=dark]{--paper:#111613;--ink:#ECE7D8;--green:#8FD9B6;--line:#2A3730;--frame:#1B231E;--soft:#A99A6A;--btn:#1C3A2E;--btnt:#A6E8C8;--panel:#18211D}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:system-ui,sans-serif}
  /* Top and bottom info */
  .top{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 54px);padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--soft);z-index:3;background:var(--paper)}
  .top b{font-weight:800;color:var(--green);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top .ttl{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-inline-start:4px}
  .top .ttl>span{font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap}
  .top #juz{white-space:nowrap}
  .top .sp{flex:1;min-width:4px}
  .top button{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--gold);background:var(--paper);color:var(--green);font-size:21px;padding:0;line-height:1}
  .top button.on{background:var(--gold)}
  .top a{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--gold);color:var(--green);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:21px;font-weight:800}
  .top .z{font:800 20px system-ui,sans-serif}
  @media (max-width:440px){.top{gap:5px}.top button,.top a{width:42px;height:42px}.top b{font-size:16px}}
  @media (max-width:360px){.top button,.top a{width:38px;height:38px}}
  /* Phone turned sideways: thinner bars, more room for the text */
  @media (max-height:500px){
    .top{height:calc(env(safe-area-inset-top) + 44px)}.top button,.top a{width:38px;height:38px;font-size:18px}
    html #nav{height:calc(env(safe-area-inset-bottom) + 52px);padding-top:5px;padding-bottom:calc(env(safe-area-inset-bottom) + 5px)}
    html #nav button{font-size:18px}html #nav #bList small{display:inline;margin-right:6px}
    html #view{top:calc(env(safe-area-inset-top) + 44px);bottom:calc(env(safe-area-inset-bottom) + 52px)}
  }
  /* Bottom: previous on the right, next on the left, like a paper mushaf */
  #nav{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 72px);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;background:var(--panel);border-top:1px solid var(--line);z-index:3}
  #nav{gap:5px;padding-left:6px;padding-right:6px}
  #nav button{flex:1;min-width:0;border:0;border-radius:14px;font:800 15px system-ui,sans-serif;background:transparent;color:var(--btnt);padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  #nav button b{font-size:22px;line-height:1}
  #nav button small{font-size:13px;font-weight:800;white-space:nowrap;color:var(--green)}
  #nav #bPrev,#nav #bNext{background:var(--btn)}
  #nav button.on{background:var(--gold)}#nav button.on small{color:#fff}
  /* Bookmark tray: three ribbons in the top corner, ready to be dragged */
  #tray{position:fixed;top:calc(env(safe-area-inset-top) + 50px);left:8px;z-index:4;display:flex;gap:4px;touch-action:none}
  /* Each ribbon is thin and short (like the silk ribbon of a paper mushaf); the touch area is wider than what you see */
  #tray .rb{width:24px;height:34px;position:relative;cursor:grab;touch-action:none}
  #tray div.rb i{left:7px;right:7px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  #tray .rb i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
  #tray .rb[data-c=r] i{background:#C0392B}#tray .rb[data-c=g] i{background:#1E9A72}#tray .rb[data-c=b] i{background:#2F6FD6}
  #tray .rb.used{opacity:.35;height:20px}
  #tray .rb.drag{opacity:.15}
  #ghost{position:fixed;left:0;top:0;width:16px;height:44px;z-index:20;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
  #ghost[hidden]{display:none}
  #ghost svg{width:100%;height:100%}
  :is(#sheet,.scopy) .ring{position:absolute;z-index:2;border:3px solid;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
  :is(#sheet,.scopy) .hov{position:absolute;z-index:0;border-radius:8px;pointer-events:none;background:rgba(201,162,39,.45);outline:2px dashed var(--gold)}
  :is(#sheet,.scopy) .hl.c-r{background:rgba(192,57,43,.22)}:is(#sheet,.scopy) .hl.c-g{background:rgba(30,154,114,.25)}:is(#sheet,.scopy) .hl.c-b{background:rgba(47,111,214,.22)}
  /* Question window and options */
  #ask,#opts{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(env(safe-area-inset-bottom) + 16px)}
  #ask[hidden],#opts[hidden]{display:none}
  #ask .card,#opts .card{width:100%;max-width:460px;background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #askT{font:800 19px system-ui,sans-serif;color:var(--ink);line-height:1.6;text-align:center;margin-bottom:14px;white-space:pre-line}
  #askB{display:grid;gap:10px}
  #askB button,#opts .wide{width:100%;min-height:54px;border:0;border-radius:14px;font:800 18px system-ui,sans-serif;background:var(--btn);color:var(--btnt);margin-top:8px}
  #askB button.gold,#opts .wide.gold{background:var(--gold);color:#fff}
  #askB button.red{background:#C0392B;color:#fff}
  #askB .dots{display:flex;gap:10px}#askB .dots button{flex:1}
  #opts .oh{font:800 20px system-ui,sans-serif;color:var(--green);text-align:center;margin-bottom:10px}
  #opts .orow{display:flex;align-items:center;justify-content:space-between;gap:10px;font:800 18px system-ui,sans-serif;color:var(--ink)}
  #opts .orow button{width:64px;height:54px;border:2px solid var(--gold);border-radius:14px;background:var(--paper);color:var(--green);font:800 22px system-ui,sans-serif}
  /* Index: search and go to page */
  #find{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
  #find input{font:700 17px system-ui,sans-serif;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0}
  #find #q{flex:1 1 180px}#find .pg{display:flex;gap:6px;flex:0 0 auto}#find #qp{width:96px}
  #find button{border:0;border-radius:12px;background:var(--gold);color:#fff;font:800 16px system-ui,sans-serif;padding:0 16px}
  #list .bm3{display:flex;align-items:center;gap:10px;padding:14px 10px;border-bottom:1px solid var(--line);font-size:18px}
  #list .bm3 .dot{width:16px;height:28px;flex:none;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
  #list .bm3 .nm{flex:1;min-width:0;cursor:pointer}
  #list .bm3 .nm small{display:block;color:#888;font-size:14px}
  #list .bm3 button{border:0;border-radius:10px;background:var(--btn);color:var(--btnt);font:800 15px system-ui,sans-serif;padding:9px 12px}
  /* Page turn: the old page is a "leaf" that turns over the new page, like a paper book */
  #turnbox{position:fixed;z-index:4;pointer-events:none;perspective:1300px;overflow:visible}
  #leaf{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  #leaf .face{position:absolute;inset:0;overflow:hidden;background:var(--paper);-webkit-backface-visibility:hidden;backface-visibility:hidden}
  #leaf .back{transform:rotateY(180deg);background:var(--paper)}
  #leaf .back .scopy{opacity:.07;transform:scaleX(-1)}
  #leaf .shade{position:absolute;inset:0;pointer-events:none}
  #under{position:absolute;inset:0;opacity:0}
  /* Binding: which side of the open mushaf this page is on.
     Right page (odd number): the spine is on its left. Left page (even): the spine is on its right. */
  #bind{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 54px);bottom:calc(env(safe-area-inset-bottom) + 72px);pointer-events:none;z-index:2}
  #bind .spine{position:absolute;top:0;bottom:0;width:22px}
  #bind .edges{position:absolute;top:6px;bottom:6px;width:5px;opacity:.55;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2.5px)}
  #bind.r .spine{left:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08) 45%,rgba(0,0,0,0))}
  #bind.r .edges{right:1px}
  #bind.l .spine{right:0;background:linear-gradient(270deg,rgba(0,0,0,.28),rgba(0,0,0,.08) 45%,rgba(0,0,0,0))}
  #bind.l .edges{left:1px}
  html[data-theme=dark] #bind .spine{filter:brightness(0) opacity(.9)}
  @media (max-height:500px){#bind{top:calc(env(safe-area-inset-top) + 44px);bottom:calc(env(safe-area-inset-bottom) + 52px)}}
  /* Bookmark ribbon hanging on a marked page */
  :is(#sheet,.scopy) .rib{position:absolute;top:-6px;width:10px;height:34px;opacity:.9;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));pointer-events:none}
  /* "Go to bookmark" chip, shown when the mushaf opens on another page */
  #gomark{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);z-index:5;border:2px solid var(--gold);background:var(--panel);color:var(--green);border-radius:999px;padding:11px 18px;font:800 16px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #gomark[hidden]{display:none}
  /* The page area */
  #view{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 54px);bottom:calc(env(safe-area-inset-bottom) + 72px);overflow:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #view.scroll{overflow:auto}
  #sheet,.scopy{margin:0 auto;direction:rtl;color:var(--ink);position:relative}
  :is(#sheet,.scopy) .ln{display:flex;flex-direction:row;justify-content:center;align-items:center;white-space:nowrap;line-height:1;direction:rtl}
  :is(#sheet,.scopy) .ln.j{justify-content:space-between}
  :is(#sheet,.scopy) .ln{position:relative;z-index:1}
  #sheet,.scopy{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  :is(#sheet,.scopy) .hl{position:absolute;z-index:0;background:rgba(201,162,39,.32);border-radius:8px;pointer-events:none}
  #view.marking :is(#sheet,.scopy) .ln span[data-v]{cursor:pointer}
  #view.marking{outline:3px dashed var(--gold);outline-offset:-3px}
  :is(#sheet,.scopy) .hd{display:flex;justify-content:center;align-items:center}
  :is(#sheet,.scopy) .hd span{display:flex;align-items:center;justify-content:center;width:100%;height:82%;border:2px solid var(--gold);border-radius:12px;background:var(--frame);color:var(--green)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:18px;text-align:center;padding:20px;line-height:1.8}
  #nextp{display:none;margin:14px auto 30px;border:0;border-radius:14px;padding:14px 26px;font:800 18px system-ui,sans-serif;background:var(--btn);color:var(--btnt)}
  #view.scroll #nextp{display:block}
  #zlbl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:14px;font:800 18px system-ui,sans-serif;z-index:9;display:none}
  #list[hidden]{display:none}
  #list{position:fixed;inset:0;background:var(--panel);z-index:6;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 20px}
  #list h2{margin:16px 0 8px;color:var(--green);font-size:18px}
  #tabs{display:flex;gap:6px;margin:4px 0 6px}
  #tabs button{flex:1;border:0;border-radius:12px;padding:12px 4px;font:800 16px system-ui,sans-serif;background:var(--btn);color:var(--btnt);opacity:.6}
  #tabs button.on{opacity:1;outline:2px solid var(--gold)}
  #list .s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:19px}
  #list .s span:last-child{color:#888;font-size:14px;white-space:nowrap}
  #list .s .x{border:0;background:none;color:#c0392b;font-size:20px;padding:0 6px}
  #list .empty{color:#888;text-align:center;padding:30px 10px;line-height:1.8}
  #list .credit{color:#888;font-size:12px;text-align:center;margin-top:18px;line-height:1.7}
  #close{position:sticky;top:0;float:left;border:0;background:var(--btn);color:var(--btnt);border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;z-index:1}
  /* Recitation: current ayah colored green, and a player bar above the buttons */
  :is(#sheet,.scopy) .pl{position:absolute;z-index:0;background:rgba(15,107,79,.22);border-radius:8px;pointer-events:none}
  html[data-theme=dark] :is(#sheet,.scopy) .pl{background:rgba(143,217,182,.22)}
  #abar{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border:2px solid var(--gold);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #abar[hidden]{display:none}
  #abar button{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--btn);color:var(--btnt);font-size:20px;padding:0}
  #abar button.on{background:var(--gold);color:#fff}
  #abar #aInfo{flex:1;min-width:0;font:700 15px system-ui,sans-serif;color:var(--green);line-height:1.35}
  #abar #aInfo small{display:block;color:var(--soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-height:500px){#abar{bottom:calc(env(safe-area-inset-bottom) + 58px)}}
  #list .s.on{background:var(--btn);border-radius:10px}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:9;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="top">
  <div class="ttl"><b id="sura"></b><span><span id="juz"></span> <span id="pno2"></span></span></div>
  <span class="sp"></span>
  <a href="/" aria-label="رجوع">✕</a>
</div>
<!-- Three bookmarks in the corner: drag one with your finger and drop it on the ayah number -->
<div id="tray" aria-label="العلامات">
  <div class="rb" data-c="r" aria-label="العلامة الحمراء"><i></i></div>
  <div class="rb" data-c="g" aria-label="العلامة الخضراء"><i></i></div>

</div>
<div id="ghost" hidden><svg viewBox="0 0 30 80" aria-hidden="true"><path d="M0 0h30v80l-15-14L0 80z"/></svg></div>
<!-- Small window for questions (move bookmark? / which bookmark?) -->
<div id="ask" hidden><div class="card"><div id="askT"></div><div id="askB"></div></div></div>
<!-- Reading options -->
<div id="opts" hidden><div class="card">
  <div class="oh">العرض</div>
  <div class="orow"><button id="zOut" class="z" aria-label="تصغير">أ−</button><span>حجم الخط</span><button id="zIn" class="z" aria-label="تكبير">أ+</button></div>
  <button id="bTheme" class="wide" aria-label="الوضع الليلي">🌙</button>

</div></div>

  <button id="bPlay"><b>🎧</b><small>استماع</small></button>
  <button id="bMarks"><b>🔖</b><small>علاماتي</small></button>

  <div id="find"><input id="q" type="search" placeholder="🔍 ابحث عن سورة…" autocomplete="off"><span class="pg"><input id="qp" type="number" inputmode="numeric" min="1" max="604" placeholder="صفحة"><button id="qgo">اذهب</button></span></div>
  <div id="slist"></div>

  <div class="credit">مصحف المدينة النبوية – مجمع الملك فهد لطباعة المصحف الشريف<br>رواية حفص عن عاصم – خط عثمان طه</div>

<script>
const $ = id => document.getElementById(id);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const CDN = ["https://cdn.jsdelivr.net/npm/quran-qcf4@1.1.0/fonts-woff2/", "https://unpkg.com/quran-qcf4@1.1.0/fonts-woff2/"];
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(_) { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(_){} }
};
let D = null, page = Math.min(604, Math.max(1, +store.get("qpage", 1) || 1));
const h = location.hash.match(/p(\d+)/); if (h) page = Math.min(604, Math.max(1, +h[1]));

// ---- Fonts: one font for a group of pages, loaded when needed ----
const fonts = {}, HDR = "QCF4_QBSML";
function fontName(n){ return "QCF4_Hafs_" + String(n).padStart(2, "0"); }
function loadFont(name){
  if (fonts[name]) return fonts[name];
  const file = name + (name === HDR ? "" : "_W") + ".woff2";
  fonts[name] = (async () => {
    for (const base of CDN) {
      try { const f = new FontFace(name, `url(${base}${file})`); await f.load(); document.fonts.add(f); return; } catch(_){}
    }
    delete fonts[name]; throw new Error("font");
  })();
  return fonts[name];
}

// ---- Size ----
// The page always keeps its printed lines (no words move to another line).
// Size 1 = the whole page fits the screen. Bigger = the whole page grows; move it with the finger
// to see the rest of a line. Change it with أ+ / أ− or with two fingers (pinch).
const SMIN = 1, SMAX = 4;
let scale = Math.min(SMAX, Math.max(SMIN, parseFloat(store.get("qscale", 1)) || 1));
const RATIO = 1.62;   // page height / page width, like the printed mushaf

let measured = {};    // natural width of each line, per page, at 100px
function measure(p){
  if (measured[p]) return measured[p];
  const [f, , , lines] = D.p[p-1];
  const s = document.createElement("span");
  s.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font:100px ${fontName(f)}`;
  document.body.appendChild(s);
  const w = lines.map(l => { if (typeof l !== "string") return 0; s.textContent = l; return s.getBoundingClientRect().width; });
  s.remove();
  return measured[p] = {w, max: Math.max(1, ...w)};
}

let renderId = 0;
async function render(keep){
  if (!D) return;
  const id = ++renderId;
  const [f, juz, sura, lines] = D.p[page-1];
  $("sura").textContent = "سورة " + D.s[sura-1][0];
  $("juz").textContent = "الجزء " + AR(juz);
  $("pno").textContent = "صفحة " + AR(page) + (page % 2 ? " · اليمنى" : " · اليسرى");
  $("pno2").textContent = "· صفحة " + AR(page);
  $("bind").className = page % 2 ? "r" : "l";
  store.set("qpage", page);
  history.replaceState(null, "", "#p" + page);
  const need = [loadFont(fontName(f)), loadFont(HDR)];
  if (lines.some(l => l[0] === "b")) need.push(loadFont(fontName(1)));
  try { await Promise.all(need); }
  catch(_) { if (id === renderId) { $("sheet").innerHTML = ""; $("msg").style.display = "flex"; $("msg").innerHTML = "تعذر تحميل الصفحة.<br>تأكد من الإنترنت ثم اسحب الصفحة مرة أخرى."; } return; }
  if (id !== renderId) return;
  $("msg").style.display = "none";
  layout(keep);
  // Get the next pages ready
  [page + 1, page - 1, page + 2].forEach(p => { if (p >= 1 && p <= 604) loadFont(fontName(D.p[p-1][0])).catch(() => {}); });
}

// keep = {fx, fy}: keep this point of the page (0..1) under the same place on the screen
function layout(keep){
  const [f, , , lines, vk] = D.p[page-1];
  const view = $("view"), sheet = $("sheet");
  sheet.className = ""; sheet.style.cssText = "";
  const vw = view.clientWidth, vh = view.clientHeight;
  const pad = Math.min(16, vw * 0.03);
  const fitAll = vw <= vh * 1.1;
  let W0;
  if (fitAll) W0 = Math.min(vw - pad * 2, (vh - 8) / RATIO);
  else W0 = Math.min(vw - pad * 2, 900);
  const W = W0 * scale;
  const m = measure(page), nat = page <= 2 ? measure(3).max : Math.max(m.max, measure(3).max);
  const fs = 100 * W / nat;                 // full lines fill the width exactly
  const lh = W * RATIO / 15;
  const big = scale > 1.01 || !fitAll;
  view.classList.toggle("scroll", big);
  sheet.style.width = W + "px";
  sheet.style.padding = (page <= 2 ? lh * 3 : 0) + "px 0";
  sheet.style.marginTop = !big ? Math.max(0, (vh - lh * 15) / 2) + "px" : "8px";
  // Wider than the screen: leave a little room on both sides
  if (W + pad * 2 > vw) { sheet.style.marginLeft = pad + "px"; sheet.style.marginRight = pad + "px"; }
  const fam = fontName(f);
  let html = "";
  lines.forEach((l, i) => {
    if (typeof l === "string") {
      // Full lines are spread to the edges; short lines stay in the middle, as printed
      const full = page > 2 && m.w[i] > nat * 0.85;
      html += `<div class="ln${full ? " j" : ""}" style="height:${lh}px;font:${page <= 2 ? fs * 0.9 : fs}px ${fam}">${(() => { const ch = [...l], out = []; let k = 0; for (const [n, v] of vk[i]) for (let j = 0; j < n; j++) out.push(`<span data-v="${v}">${ch[k++] || ""}</span>`); while (k < ch.length) out.push(`<span>${ch[k++]}</span>`); return out.join(""); })()}</div>`;
    } else if (l[0] === "h") {
      html += `<div class="hd" style="height:${lh}px"><span style="font:${fs * 0.95}px ${HDR}">${String.fromCharCode(0xF100 + l[1] - 1)}</span></div>`;
    } else {
      html += `<div class="ln" style="height:${lh}px;font:${fs * 0.9}px ${fontName(1)}">${String.fromCharCode(l[1])}</div>`;
    }
  });
  sheet.innerHTML = html;
  showMarks();
  if (keep) {
    // Keep the pinched point in the same place on the screen
    view.scrollTop = 0; view.scrollLeft = view.scrollWidth;
    const b = sheet.getBoundingClientRect(), vb = view.getBoundingClientRect();
    view.scrollLeft += (b.right - keep.fx * b.width) - (vb.right - keep.sx);
    view.scrollTop += (b.top + keep.fy * b.height) - (vb.top + keep.sy);
  } else {
    // A new page starts at the top, on the right side (start of the line)
    view.scrollTop = 0;
    view.scrollLeft = view.scrollWidth;
  }
  $("nextp").style.visibility = page < 604 ? "visible" : "hidden";
}

function showLabel(t){

// Where the middle of the screen is on the page (0..1), to keep it there after a size change
function focusPoint(cx, cy){
  const v = $("view"), sh = $("sheet"), vb = v.getBoundingClientRect(), b = sh.getBoundingClientRect();
  if (cx === undefined) { cx = vb.left + vb.width / 2; cy = vb.top + vb.height / 2; }
  return {fx: (b.right - cx) / b.width, fy: (cy - b.top) / b.height, sx: vb.right - cx, sy: cy - vb.top};
}
function setScale(s2, keep){
  s2 = Math.min(SMAX, Math.max(SMIN, Math.round(s2 * 100) / 100));
  if (Math.abs(s2 - scale) < 0.01) { if (D) layout(keep); return; }
  scale = s2; store.set("qscale", scale);
  if (D) layout(keep || focusPoint());
  showLabel(scale <= 1.01 ? "الصفحة كاملة" : "تكبير " + AR(Math.round(scale * 100)) + "٪");
}
const STEPS = [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4];
$("zIn").onclick = e => { e.stopPropagation(); setScale(STEPS.find(x => x > scale + 0.01) || SMAX); };
$("zOut").onclick = e => { e.stopPropagation(); setScale([...STEPS].reverse().find(x => x < scale - 0.01) || SMIN); };

const MC = {r: ["#C0392B", "الحمراء", "🔴"], g: ["#1E9A72", "الخضراء", "🟢"], b: ["#2F6FD6", "الزرقاء", "🔵"]};

// Color all the words of ayah v on the page with class cls
function colorAyah(sheet, v, cls){
  const base = sheet.getBoundingClientRect();
  sheet.querySelectorAll(".ln").forEach(ln => {
    const ws = [...ln.querySelectorAll(`span[data-v="${v}"]`)];
    if (!ws.length) return;
    let l = Infinity, r = -Infinity;
    ws.forEach(w => { const b = w.getBoundingClientRect(); l = Math.min(l, b.left); r = Math.max(r, b.right); });
    const h = ln.offsetHeight, d = document.createElement("div");
    d.className = cls;
    d.style.cssText = `left:${l - base.left - 3}px;width:${r - l + 6}px;top:${ln.offsetTop + h * 0.08}px;height:${h * 0.84}px`;
    sheet.appendChild(d);
  });
}
// Small colored ring around the ayah number (the last sign of the ayah on the page)
function ringAyah(sheet, v, color){
  const ws = sheet.querySelectorAll(`span[data-v="${v}"]`);
  if (!ws.length) return;
  const end = ws[ws.length - 1], base = sheet.getBoundingClientRect(), b = end.getBoundingClientRect();
  const size = Math.max(b.width, b.height * 0.72) + 8, d = document.createElement("div");
  d.className = "ring";
  d.style.cssText = `left:${b.left - base.left + b.width / 2 - size / 2}px;top:${b.top - base.top + b.height / 2 - size / 2}px;width:${size}px;height:${size}px;border-color:${color}`;
  sheet.appendChild(d);
}
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(_){} }
// Small question window. btns: [[text, class, fn], ...]
function ask(text, btns){
  $("askT").textContent = text;
  $("askB").innerHTML = "";
  btns.forEach(([t, cls, fn]) => {
    const b = document.createElement("button");

// Put bookmark c at page p, ayah v (v = "" : the whole page)
function place(c, p, v){
  const old = allMarks()[c];
  const put = () => {
    setMark(c, {p, v: v || "", t: Date.now()});
    buzz(40); paperSound(0.35);
    toast(MC[c][2] + " " + (v ? ayaName(v) : "صفحة " + AR(p)));
    $("gomark").hidden = true;
    showMarks();
  };
  if (old && old.p === p && (old.v || "") === (v || "")) { toast(MC[c][2] + " العلامة موجودة هنا"); return; }
  if (old && old.p) {
    buzz([30, 60, 30]);
    ask("العلامة " + MC[c][1] + " موجودة الآن في:\n" + markName(old) + "\n\nهل تريد إزالتها من هناك ووضعها هنا؟",
      [["نعم، انقلها إلى هنا", "gold", put], ["لا، اتركها مكانها", "", null]]);

}
function removeMark(c){

// ---- Drag from the tray ----
let drag = null;
function dropPoint(e){ return {x: e.clientX, y: e.clientY - 46}; }   // the ribbon tip is just above the finger
function hoverAt(pt){
  const sheet = $("sheet");
  sheet.querySelectorAll(".hov").forEach(x => x.remove());
  const el = document.elementFromPoint(pt.x, pt.y);
  const w = el && el.closest && el.closest("#sheet span[data-v]");
  sheet.querySelectorAll(".ring.tmp").forEach(x => x.remove());
  if (w) { ringAyah(sheet, w.dataset.v, drag ? MC[drag.c][0] : "#C9A227"); const rr = sheet.querySelectorAll(".ring"); rr[rr.length - 1].classList.add("tmp"); }
  return {w, inPage: !!(el && el.closest && el.closest("#sheet"))};
}
function moveGhost(e){
  const pt = dropPoint(e), g = $("ghost");
  g.style.transform = `translate(${pt.x - 8}px, ${pt.y - 44}px)`;
  drag.hit = hoverAt(pt);
}
document.querySelectorAll("#tray .rb").forEach(rb => {
  rb.addEventListener("pointerdown", e => {
    e.preventDefault();
    const c = rb.dataset.c;
    drag = {c, x0: e.clientX, y0: e.clientY, moved: false, rb, hit: null};
    try { rb.setPointerCapture(e.pointerId); } catch(_){}
  });
  rb.addEventListener("pointermove", e => {
    if (!drag || drag.rb !== rb) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
      drag.moved = true; buzz(25);
      const g = $("ghost"); g.querySelector("path").setAttribute("fill", MC[drag.c][0]); g.hidden = false;
      rb.classList.add("drag");
    }
    if (drag.moved) moveGhost(e);
  });
  const end = e => {
    if (!drag || drag.rb !== rb) return;
    const d = drag; drag = null;
    rb.classList.remove("drag"); $("ghost").hidden = true;
    $("sheet").querySelectorAll(".hov,.ring.tmp").forEach(x => x.remove());
    if (!d.moved) {   // just a tap
      const x = allMarks()[d.c];
      if (x && x.p) ask("العلامة " + MC[d.c][1] + ":\n" + markName(x), [["اذهب إليها", "gold", () => go(x.p)], ["أزل العلامة", "red", () => removeMark(d.c)], ["إغلاق", "", null]]);
      else toast("اسحب العلامة " + MC[d.c][1] + " وضعها على رقم الآية");
      return;
    }
    if (e.type === "pointercancel") return;
    drag = d; const hit = hoverAt(dropPoint(e)); drag = null; $("sheet").querySelectorAll(".hov,.ring.tmp").forEach(x => x.remove());
    if (hit.w) place(d.c, page, hit.w.dataset.v);
    else if (hit.inPage) place(d.c, page, "");
    else toast("ضع العلامة على الآية في الصفحة");
  };
  rb.addEventListener("pointerup", end);
  rb.addEventListener("pointercancel", end);
});

// ---- Turning pages, like a paper book ----
// Swipe right = next page (the page lifts from its left edge and turns over to the right),
// swipe left = previous page. The page follows the finger; let go early and it falls back.
// When the page is zoomed, the finger first moves the page; at its edge, the next swipe turns it.
// Two fingers = zoom in / out (the lines never break).
const view = $("view");
let T = null;   // current touch: {x0, y0, mode: "?"|"turn"|"pan"|"pinch", ...}
function edge(){
  // At which side the zoomed page is fully shown (RTL scroll: 0 = right edge)
  const max = view.scrollWidth - view.clientWidth;
  if (max <= 2) return {left: true, right: true};
  const sl = Math.abs(view.scrollLeft);
  return {right: sl <= 2, left: sl >= max - 2};
}
function makeLeaf(dir){
  // A picture of the page now on screen, put over it
  const vb = view.getBoundingClientRect(), sb = $("sheet").getBoundingClientRect();
  const box = document.createElement("div"); box.id = "turnbox";
  box.style.cssText = `left:${vb.left}px;top:${vb.top}px;width:${view.clientWidth}px;height:${view.clientHeight}px`;
  const leaf = document.createElement("div"); leaf.id = "leaf";
  leaf.style.transformOrigin = dir > 0 ? "right center" : "left center";
  const front = document.createElement("div"); front.className = "face";
  // The real page moves into the leaf (not a copy): the finger's touch stays on it while the
  // new page is drawn in a fresh sheet under it
  const copy = $("sheet"); copy.removeAttribute("id"); copy.className = "scopy";
  const fresh = document.createElement("div"); fresh.id = "sheet";
  view.insertBefore(fresh, $("nextp"));
  copy.style.position = "absolute"; copy.style.margin = "0";
  copy.style.left = (sb.left - vb.left) + "px"; copy.style.top = (sb.top - vb.top) + "px";
  front.appendChild(copy);
  const shade = document.createElement("div"); shade.className = "shade"; front.appendChild(shade);
  const back = document.createElement("div"); back.className = "face back";
  const ghost = copy.cloneNode(true); back.appendChild(ghost);
  const bshade = document.createElement("div"); bshade.className = "shade"; back.appendChild(bshade);
  leaf.appendChild(front); leaf.appendChild(back);
  const under = document.createElement("div"); under.id = "under";
  box.appendChild(under); box.appendChild(leaf);
  document.body.appendChild(box);
  return {leaf, shade, bshade, under, box};
}
function setTurn(t, p){
  // p: 0 (flat) .. 1 (turned over). The paper lifts a little, bends a little, and casts a shadow.
  p = Math.max(0, Math.min(1, p));
  const a = p * 180 * t.dir, k = Math.sin(p * Math.PI);
  t.el.leaf.style.transform = `rotateY(${a}deg) translateZ(${18 * k}px) skewY(${-2.2 * k * t.dir}deg)`;
  // Front: darker near the fold as it lifts, with a soft light line at the bending edge
  const side = t.dir > 0 ? 270 : 90;
  t.el.shade.style.background = `linear-gradient(${side}deg, rgba(0,0,0,${0.32 * k}) 0%, rgba(0,0,0,${0.1 * k}) 35%, rgba(255,255,255,${0.12 * k}) 70%, rgba(0,0,0,${0.18 * k}) 100%)`;
  if (t.el.bshade) t.el.bshade.style.background = `linear-gradient(${side}deg, rgba(0,0,0,${0.25 * k}), rgba(0,0,0,0) 60%)`;
  // Shadow of the turning page on the next page, strongest near the spine
  t.el.under.style.background = `linear-gradient(${side}deg, rgba(0,0,0,.45), rgba(0,0,0,0) ${30 + 50 * (1 - p)}%)`;
  t.el.under.style.opacity = String(0.9 * (1 - p) * Math.min(1, p * 4));
}
let lastTurn = null;
function endTurn(t, done){
  if (t.ending) return; t.ending = true;
  const from = t.p, to = done ? 1 : 0, start = performance.now(), dur = 700 * Math.abs(to - from) + 140;
  if (done && !t.sounded) paperSound(0.9);
  const step = now => {
    const k = Math.min(1, (now - start) / dur);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;   // slow start and slow end
    setTurn(t, from + (to - from) * e);
    if (k < 1) return requestAnimationFrame(step);
    if (!done) { page = t.from; render(); }
    t.el.box.remove();
  };
  requestAnimationFrame(step);
}

// ---- Paper sound (made in the browser, no file to download) ----
let actx = null, soundOn = store.get("qsound", "1") === "1";
function audio(){
  if (!soundOn) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch(_) { return null; }
}
function paperSound(v){
  // A light sheet of newspaper: short, crisp and quiet (high soft noise with tiny crackles), no "air" sound
  const ac = audio(); if (!ac) return;
  try {
    const t0 = ac.currentTime, len = 0.2, n = Math.floor(ac.sampleRate * len);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const x = i / n;
      const env = x < 0.08 ? x / 0.08 : Math.pow(1 - (x - 0.08) / 0.92, 2.4);   // quick start, soft end
      let w = (Math.random() * 2 - 1) * 0.5;
      if (Math.random() < 0.004) w += (Math.random() < 0.5 ? -1 : 1) * 0.9;     // tiny paper crackles
      d[i] = w * env;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(3200, t0);
    bp.frequency.linearRampToValueAtTime(5200, t0 + len);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
    const g = ac.createGain(); g.gain.value = 0.07 * (v || 1);
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ac.destination);
    src.start(t0);
  } catch(_) {}
}

function startTurn(dir){
  const to = page + dir;
  if (to < 1 || to > 604) return null;
  const el = makeLeaf(dir);
  const t = {dir, from: page, el, p: 0};
  lastTurn = t;
  page = to; render();
  return t;
}
// Buttons and arrow keys also turn the page
function turn(dir){
  if (lastTurn && !lastTurn.ending) endTurn(lastTurn, true);
  const t = startTurn(dir); if (t) endTurn(t, true);
}
view.addEventListener("touchstart", e => {
  audio();
  // A turn left half-way (touch lost): finish it now
  if (lastTurn && !lastTurn.ending && !(T && T.mode === "turn")) endTurn(lastTurn, lastTurn.p > 0.25);
  if (!$("list").hidden || marking) { T = null; return; }
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
    T = {mode: "pinch", d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s0: scale, keep: focusPoint(cx, cy), cx, cy};
    $("sheet").style.transformOrigin = `${cx - $("sheet").getBoundingClientRect().left}px ${cy - $("sheet").getBoundingClientRect().top}px`;
    return;
  }
  if (e.touches.length > 2) { T = null; return; }
  T = {mode: "?", x0: e.touches[0].clientX, y0: e.touches[0].clientY, ed: edge()};
}, {passive: true});
// Move and end are listened on the whole window: the page under the finger is redrawn while turning
addEventListener("touchmove", e => {
  if (!T) return;
  if (T.mode === "pinch") {
    if (e.touches.length < 2) return;
    e.preventDefault();
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    T.s = Math.min(SMAX, Math.max(SMIN, T.s0 * d / T.d0));
    $("sheet").style.transform = `scale(${T.s / T.s0})`;
    return;
  }
  const x = e.touches[0].clientX, y = e.touches[0].clientY, dx = x - T.x0, dy = y - T.y0;
  if (T.mode === "?") {
    if (Math.hypot(dx, dy) < 12) return;
    const horiz = Math.abs(dx) > Math.abs(dy) * 1.3;
    const dir = dx > 0 ? 1 : -1;
    // Zoomed: turn only from the edge of the page, else the finger moves the page
    const atEdge = dir > 0 ? T.ed.left : T.ed.right;
    if (horiz && atEdge && !(lastTurn && !lastTurn.ending)) {
      const t = startTurn(dir);
      if (!t) { T.mode = "pan"; return; }
      T.mode = "turn"; T.t = t; T.x0 = x;
      paperSound(0.9); t.sounded = true;
    } else { T.mode = "pan"; return; }
  }
  if (T.mode === "turn") {
    e.preventDefault();
    T.t.p = Math.max(0, Math.min(1, (x - T.x0) * T.t.dir / (view.clientWidth * 0.9)));
    setTurn(T.t, T.t.p);
  }
}, {passive: false});
addEventListener("touchend", e => {
  if (!T) return;
  if (T.mode === "pinch") {
    if (e.touches.length) return;
    $("sheet").style.transform = ""; $("sheet").style.transformOrigin = "";
    if (T.s) setScale(T.s, T.keep);
    T = null; return;
  }
  if (T.mode === "turn") {
    const dx = e.changedTouches[0].clientX - T.x0;
    endTurn(T.t, T.t.p > 0.25 || Math.abs(dx) > 90);
  }
  T = null;
});
addEventListener("touchcancel", () => { if (T && T.mode === "turn") endTurn(T.t, T.t.p > 0.5); if (T && T.mode === "pinch") { $("sheet").style.transform = ""; } T = null; });
addEventListener("keydown", e => { if (e.key === "ArrowLeft") turn(1); if (e.key === "ArrowRight") turn(-1); });
$("bNext").onclick = () => turn(1);
$("bPrev").onclick = () => turn(-1);
$("bList").onclick = () => { if (tab === "m") tab = "s"; fillList(); $("list").hidden = false; };
$("bMarks").onclick = () => { tab = "m"; fillList(); $("list").hidden = false; };
$("q").addEventListener("input", fillList);
const goPage = () => { const n = +$("qp").value; if (n >= 1 && n <= 604) { go(n); $("list").hidden = true; $("qp").value = ""; } else toast("اكتب رقم صفحة من ١ إلى ٦٠٤"); };
$("qgo").onclick = goPage;
$("qp").addEventListener("keydown", e => { if (e.key === "Enter") goPage(); });
// Reading options: text size, night mode, keep the screen on
$("bOpts").onclick = () => { awakeBtn(); $("opts").hidden = false; };
$("optsX").onclick = () => $("opts").hidden = true;
$("opts").addEventListener("click", e => { if (e.target === $("opts")) $("opts").hidden = true; });
let awakeOn = store.get("qawake", "1") === "1", readLock = null;
function awakeBtn(){ $("bAwake").textContent = awakeOn ? "💡 الشاشة تبقى مضاءة أثناء القراءة: نعم" : "💡 الشاشة تبقى مضاءة أثناء القراءة: لا"; }
async function readAwake(){
  try {
    if (awakeOn && !document.hidden && "wakeLock" in navigator) { if (!readLock) { readLock = await navigator.wakeLock.request("screen"); readLock.addEventListener("release", () => readLock = null); } }
    else if (readLock) { readLock.release(); readLock = null; }
  } catch(_){}
}
$("bAwake").onclick = () => { awakeOn = !awakeOn; store.set("qawake", awakeOn ? "1" : "0"); awakeBtn(); readAwake(); };
document.addEventListener("visibilitychange", readAwake);
readAwake();
$("close").onclick = () => $("list").hidden = true;
function soundBtn(){ $("bSound").textContent = soundOn ? "🔊 صوت تقليب الورق: يعمل" : "🔇 صوت تقليب الورق: متوقف"; }
$("bSound").onclick = () => { soundOn = !soundOn; store.set("qsound", soundOn ? "1" : "0"); soundBtn(); if (soundOn) paperSound(0.8); };
soundBtn();
// Turning the phone: redraw to fit the new screen
let rt; const relayout = () => { clearTimeout(rt); rt = setTimeout(() => { if (D && $("msg").style.display === "none") layout(); }, 150); };
addEventListener("resize", relayout);
addEventListener("orientationchange", relayout);
if (window.visualViewport) visualViewport.addEventListener("resize", relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe($("view"));

// ---- Recitation: ayah by ayah, the ayah is colored, the page turns by itself ----
// Audio: everyayah.com (one file per ayah, high quality)
const RECITERS = [
  ["Alafasy_128kbps", "مشاري العفاسي"],
  ["MaherAlMuaiqly128kbps", "ماهر المعيقلي"],
  ["Abdurrahmaan_As-Sudais_192kbps", "عبدالرحمن السديس"],
  ["Saood_ash-Shuraym_128kbps", "سعود الشريم"],
  ["Yasser_Ad-Dussary_128kbps", "ياسر الدوسري"],
  ["Husary_128kbps", "محمود خليل الحصري"],
  ["Minshawy_Murattal_128kbps", "محمد صديق المنشاوي"],
  ["Abdul_Basit_Murattal_192kbps", "عبدالباسط عبدالصمد"]
];
let reciter = store.get("qreciter", RECITERS[0][0]);
if (!RECITERS.some(r => r[0] === reciter)) reciter = RECITERS[0][0];
const recName = () => RECITERS.find(r => r[0] === reciter)[1];
const player = new Audio(), pre = new Audio();
player.preload = "auto"; pre.preload = "auto";
let cur = null, basmala = false, repeat = false, active = false, wake = null;
const p3 = n => String(n).padStart(3, "0");
const urlOf = (s, a) => `https://everyayah.com/data/${reciter}/${p3(s)}${p3(a)}.mp3`;
const urlV = v => { const [s, a] = v.split(":"); return urlOf(+s, +a); };
// Ayahs on a page, in order
function ayahsOn(p){
  const out = [];
  (D.p[p-1][4] || []).forEach(l => (l || []).forEach(x => { const v = x && x[1]; if (v && !out.includes(v)) out.push(v); }));
  return out;
}
function showPlaying(){
  const sheet = $("sheet");
  sheet.querySelectorAll(".pl").forEach(e => e.remove());
  if (cur && active) colorAyah(sheet, cur, "pl");
}
function barInfo(){
  $("aInfo").innerHTML = (cur ? ayaName(cur) : "") + `<small>🎧 ${recName()}</small>`;
  $("aPlay").textContent = player.paused ? "▶" : "⏸";
  $("aRep").classList.toggle("on", repeat);
  $("bPlay").classList.toggle("on", active);
}
function keepAwake(on){
  try {
    if (on && !wake && navigator.wakeLock) navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {});
    if (!on && wake) { wake.release(); wake = null; }
  } catch(_) {}
}
function playAyah(v){
  cur = v; active = true; $("abar").hidden = false;
  const [s, a] = v.split(":").map(Number);
  // Basmala before the first ayah of each surah (not Al-Fatiha, it is ayah 1; not At-Tawbah)
  basmala = a === 1 && s !== 1 && s !== 9;
  player.src = basmala ? urlOf(1, 1) : urlV(v);
  player.play().catch(() => { toast("اضغط ▶ للتشغيل"); barInfo(); });
  // Get the next ayah ready
  const n = nextAyah(v); if (n) pre.src = urlV(n.v);
  showPlaying(); barInfo(); keepAwake(true); media();
}
function nextAyah(v){
  const list = ayahsOn(page), i = list.indexOf(v);
  if (i >= 0 && i < list.length - 1) return {v: list[i + 1], p: page};
  for (let p = page + 1; p <= Math.min(604, page + 1); p++) {
    const n = ayahsOn(p).find(x => x !== v);
    if (n) return {v: n, p};
  }
  return null;
}
function stopAudio(){
  player.pause(); player.removeAttribute("src"); active = false; cur = null;
  $("abar").hidden = true; showPlaying(); barInfo(); keepAwake(false);
}
player.addEventListener("ended", () => {
  if (basmala) { basmala = false; player.src = urlV(cur); player.play().catch(() => {}); return; }
  if (repeat) { player.currentTime = 0; player.play().catch(() => {}); return; }
  const n = nextAyah(cur);
  if (!n) { stopAudio(); toast("صدق الله العظيم"); return; }
  if (n.p !== page) { turn(1); setTimeout(() => playAyah(n.v), 350); }
  else playAyah(n.v);
});
player.addEventListener("play", barInfo);
player.addEventListener("pause", barInfo);
player.addEventListener("error", () => { if (active && player.getAttribute("src")) { toast("تعذر تشغيل التلاوة. تأكد من الإنترنت"); player.pause(); barInfo(); } });
function setReciter(id){
  reciter = id; store.set("qreciter", id);
  toast("🎧 " + recName());
  if (active && cur) playAyah(cur);
}
$("bPlay").onclick = () => {
  if (!D) return;
  if (active) { player.paused ? player.play().catch(() => {}) : player.pause(); return; }
  // Start from the bookmarked ayah if it is on this page, else from the first ayah of the page
  const m = getMark(), list = ayahsOn(page);
  playAyah(m && m.p === page && m.v && list.includes(m.v) ? m.v : list[0]);
};
$("aPlay").onclick = () => { if (player.paused) { if (!player.getAttribute("src") && cur) playAyah(cur); else player.play().catch(() => {}); } else player.pause(); };
$("aStop").onclick = stopAudio;
$("aRep").onclick = () => { repeat = !repeat; toast(repeat ? "🔁 تكرار الآية: يعمل" : "تكرار الآية: متوقف"); barInfo(); };
// While reciting: tap any ayah to start from it
$("view").addEventListener("click", e => {
  if (!active) return;
  const w = e.target.closest("span[data-v]");
  if (w) playAyah(w.dataset.v);
});
// Lock screen and headphone / car buttons
function media(){
  if (!("mediaSession" in navigator) || !cur) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({title: ayaName(cur), artist: recName(), album: "القرآن الكريم – أقرب مسجد",
      artwork: [{src: "/icon-512.png", sizes: "512x512", type: "image/png"}]});
    navigator.mediaSession.setActionHandler("play", () => player.play());
    navigator.mediaSession.setActionHandler("pause", () => player.pause());
    navigator.mediaSession.setActionHandler("stop", stopAudio);
    navigator.mediaSession.setActionHandler("nexttrack", () => { const n = nextAyah(cur); if (n) { if (n.p !== page) turn(1); playAyah(n.v); } });
    navigator.mediaSession.setActionHandler("previoustrack", () => { const l = ayahsOn(page), i = l.indexOf(cur); if (i > 0) playAyah(l[i - 1]); });
  } catch(_) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && active) keepAwake(true); });

fetch("mushaf.json").then(r => r.json()).then(j => { D = j; render(); setTimeout(offerMark, 800); })
  .catch(() => { $("msg").innerHTML = "تعذر تحميل المصحف.<br>تأكد من الإنترنت."; });
