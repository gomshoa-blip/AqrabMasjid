<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EC">
<title>المصحف – أقرب مسجد</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root{--paper:#FBF7EC;--ink:#1b1b1b;--green:#0F6B4F;--gold:#C9A227;--line:#e4dcc5;--frame:#fff8e2;--soft:#7a6a3f;--btn:#DCEEE5;--btnt:#0A4A37;--panel:#fff}
  html[data-theme=dark]{--paper:#111613;--ink:#ECE7D8;--green:#8FD9B6;--line:#2A3730;--frame:#1B231E;--soft:#A99A6A;--btn:#1C3A2E;--btnt:#A6E8C8;--panel:#18211D}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:system-ui,sans-serif}
  /* Top and bottom info */
  .top{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 44px);padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);z-index:3;background:var(--paper)}
  .top b{font-weight:800;color:var(--green);font-size:16px}
  .top .sp{flex:1}
  .top button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--green);font-size:19px;padding:0;line-height:1}
  .top button.on{background:var(--gold)}
  .top a{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);color:var(--green);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;font-weight:800}
  .top .z{font:800 17px system-ui,sans-serif}
  /* Bottom: previous on the right, next on the left, like a paper mushaf */
  #nav{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 62px);padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);display:flex;gap:7px;background:var(--panel);border-top:1px solid var(--line);z-index:3}
  #nav button{flex:1;border:0;border-radius:12px;font:800 17px system-ui,sans-serif;background:var(--btn);color:var(--btnt);padding:0 4px}
  #nav #bList{flex:.9;background:transparent;border:1.5px solid var(--gold);color:var(--green);line-height:1.15}
  #nav #bList small{display:block;font-size:13px;font-weight:700;color:var(--soft)}
  /* The page area */
  #view{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 44px);bottom:calc(env(safe-area-inset-bottom) + 62px);overflow:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #view.scroll{overflow:auto}
  #sheet{margin:0 auto;direction:rtl;color:var(--ink);position:relative}
  #sheet .ln{display:flex;flex-direction:row;justify-content:center;align-items:center;white-space:nowrap;line-height:1;direction:rtl}
  #sheet .ln.j{justify-content:space-between}
  #sheet .hd{display:flex;justify-content:center;align-items:center}
  #sheet .hd span{display:flex;align-items:center;justify-content:center;width:100%;height:82%;border:2px solid var(--gold);border-radius:12px;background:var(--frame);color:var(--green)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:18px;text-align:center;padding:20px;line-height:1.8}
  #nextp{display:none;margin:14px auto 30px;border:0;border-radius:14px;padding:14px 26px;font:800 18px system-ui,sans-serif;background:var(--btn);color:var(--btnt)}
  #view.scroll #nextp{display:block}
  #zlbl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:14px;font:800 18px system-ui,sans-serif;z-index:9;display:none}
  #list[hidden]{display:none}
  #list{position:fixed;inset:0;background:var(--panel);z-index:6;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 20px}
  #list h2{margin:16px 0 8px;color:var(--green);font-size:18px}
  #tabs{display:flex;gap:6px;margin:4px 0 6px}
  #tabs button{flex:1;border:0;border-radius:12px;padding:12px 4px;font:800 16px system-ui,sans-serif;background:var(--btn);color:var(--btnt);opacity:.6}
  #tabs button.on{opacity:1;outline:2px solid var(--gold)}
  #list .s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:19px}
  #list .s span:last-child{color:#888;font-size:14px;white-space:nowrap}
  #list .s .x{border:0;background:none;color:#c0392b;font-size:20px;padding:0 6px}
  #list .empty{color:#888;text-align:center;padding:30px 10px;line-height:1.8}
  #list .credit{color:#888;font-size:12px;text-align:center;margin-top:18px;line-height:1.7}
  #close{position:sticky;top:0;float:left;border:0;background:var(--btn);color:var(--btnt);border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;z-index:1}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:9;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="top">
  <b id="sura"></b><span id="juz"></span><span class="sp"></span>
  <button id="zIn" class="z" aria-label="تكبير">أ+</button>
  <button id="zOut" class="z" aria-label="تصغير">أ−</button>
  <button id="bMark" aria-label="علامة">🔖</button>
  <button id="bTheme" aria-label="الوضع الليلي">🌙</button>
  <a href="/" aria-label="رجوع">✕</a>
</div>
<div id="view"><div id="sheet"></div><button id="nextp">الصفحة التالية ←</button><div id="msg">جاري التحميل…</div></div>
<div id="nav">
  <button id="bPrev">→ السابقة</button>
  <button id="bList">☰ الفهرس<small id="pno"></small></button>
  <button id="bNext">التالية ←</button>
</div>
<div id="zlbl"></div>
<div id="toast"></div>

<div id="list" hidden>
  <button id="close">✕</button>
  <div id="tabs" style="clear:both;padding-top:8px">
    <button data-t="s" class="on">السور</button>
    <button data-t="j">الأجزاء</button>
    <button data-t="m">🔖 العلامات</button>
  </div>
  <div id="slist"></div>
  <div class="credit">مصحف المدينة النبوية – مجمع الملك فهد لطباعة المصحف الشريف<br>رواية حفص عن عاصم – خط عثمان طه</div>
</div>

<script>
const $ = id => document.getElementById(id);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const CDN = ["https://cdn.jsdelivr.net/npm/quran-qcf4@1.1.0/fonts-woff2/", "https://unpkg.com/quran-qcf4@1.1.0/fonts-woff2/"];
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(_) { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(_){} }
};
let D = null, page = Math.min(604, Math.max(1, +store.get("qpage", 1) || 1));
const h = location.hash.match(/p(\d+)/); if (h) page = Math.min(604, Math.max(1, +h[1]));

// ---- Fonts: one font for a group of pages, loaded when needed ----
const fonts = {}, HDR = "QCF4_QBSML";
function fontName(n){ return "QCF4_Hafs_" + String(n).padStart(2, "0"); }
function loadFont(name){
  if (fonts[name]) return fonts[name];
  const file = name + (name === HDR ? "" : "_W") + ".woff2";
  fonts[name] = (async () => {
    for (const base of CDN) {
      try { const f = new FontFace(name, `url(${base}${file})`); await f.load(); document.fonts.add(f); return; } catch(_){}
    }
    delete fonts[name]; throw new Error("font");
  })();
  return fonts[name];
}

// ---- Text size ----
// 0 = whole page on the screen, 1 = page fills the width (scroll down), 2+ = bigger
const ZOOMS = [0, 1, 1.3, 1.6];
let zi = Math.min(ZOOMS.length - 1, Math.max(0, +store.get("qzoom2", 0) || 0));
const RATIO = 1.62;   // page height / page width, like the printed mushaf

let measured = {};    // natural width of each line, per page, at 100px
function measure(p){
  if (measured[p]) return measured[p];
  const [f, , , lines] = D.p[p-1];
  const s = document.createElement("span");
  s.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font:100px ${fontName(f)}`;
  document.body.appendChild(s);
  const w = lines.map(l => { if (typeof l !== "string") return 0; s.textContent = l; return s.getBoundingClientRect().width; });
  s.remove();
  return measured[p] = {w, max: Math.max(1, ...w)};
}

let renderId = 0;
async function render(){
  if (!D) return;
  const id = ++renderId;
  const [f, juz, sura, lines] = D.p[page-1];
  $("sura").textContent = "سورة " + D.s[sura-1][0];
  $("juz").textContent = "· الجزء " + AR(juz);
  $("pno").textContent = "صفحة " + AR(page);
  markBtn();
  store.set("qpage", page);
  history.replaceState(null, "", "#p" + page);
  const need = [loadFont(fontName(f)), loadFont(HDR)];
  if (lines.some(l => l[0] === "b")) need.push(loadFont(fontName(1)));
  try { await Promise.all(need); }
  catch(_) { if (id === renderId) { $("sheet").innerHTML = ""; $("msg").style.display = "flex"; $("msg").innerHTML = "تعذر تحميل الصفحة.<br>تأكد من الإنترنت ثم اسحب الصفحة مرة أخرى."; } return; }
  if (id !== renderId) return;
  $("msg").style.display = "none";
  layout();
  // Get the next pages ready
  [page + 1, page - 1].forEach(p => { if (p >= 1 && p <= 604) loadFont(fontName(D.p[p-1][0])).catch(() => {}); });
}

function layout(){
  const [f, , , lines] = D.p[page-1];
  const view = $("view"), sheet = $("sheet");
  const vw = view.clientWidth, vh = view.clientHeight;
  const pad = Math.min(16, vw * 0.03);
  let W;
  if (ZOOMS[zi] === 0 && vw <= vh * 1.1) W = Math.min(vw - pad * 2, (vh - 8) / RATIO);
  else if (ZOOMS[zi] === 0) W = Math.min(vw - pad * 2, 900);
  else W = (vw - pad * 2) * ZOOMS[zi];
  const m = measure(page), nat = page <= 2 ? measure(3).max : Math.max(m.max, measure(3).max);
  const fs = 100 * W / nat;                 // full lines fill the width exactly
  const rows = page <= 2 ? 15 : lines.length;
  const lh = W * RATIO / 15;
  const fitAll = ZOOMS[zi] === 0 && vw <= vh * 1.1;
  view.classList.toggle("scroll", !fitAll);
  sheet.style.width = W + "px";
  sheet.style.padding = (page <= 2 ? lh * 3 : 0) + "px 0";
  sheet.style.marginTop = fitAll ? Math.max(0, (vh - lh * 15) / 2) + "px" : "8px";
  const fam = fontName(f);
  let html = "";
  lines.forEach((l, i) => {
    if (typeof l === "string") {
      // Full lines are spread to the edges; short lines stay in the middle, as printed
      const full = page > 2 && m.w[i] > nat * 0.85;
      html += `<div class="ln${full ? " j" : ""}" style="height:${lh}px;font:${page <= 2 ? fs * 0.9 : fs}px ${fam}">${[...l].map(c => "<span>" + c + "</span>").join("")}</div>`;
    } else if (l[0] === "h") {
      html += `<div class="hd" style="height:${lh}px"><span style="font:${fs * 0.95}px ${HDR}">${String.fromCharCode(0xF100 + l[1] - 1)}</span></div>`;
    } else {
      html += `<div class="ln" style="height:${lh}px;font:${fs * 0.9}px ${fontName(1)}">${String.fromCharCode(l[1])}</div>`;
    }
  });
  sheet.innerHTML = html;
  // Wide pages: start from the right side (start of the line)
  view.scrollTop = 0;
  view.scrollLeft = view.scrollWidth;
  $("nextp").style.visibility = page < 604 ? "visible" : "hidden";
}

function showLabel(t){
  const l = $("zlbl"); l.textContent = t; l.style.display = "block";
  clearTimeout(showLabel.t); showLabel.t = setTimeout(() => l.style.display = "none", 900);
}
function toast(t){
  const l = $("toast"); l.textContent = t; l.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => l.style.display = "none", 1600);
}
function setZoom(d){
  const z = Math.min(ZOOMS.length - 1, Math.max(0, zi + d));
  if (z === zi) return;
  zi = z; store.set("qzoom2", zi);
  if (D) layout();
  showLabel(zi ? "حجم الخط " + AR(zi) + " / " + AR(ZOOMS.length - 1) : "صفحة كاملة");
}
$("zIn").onclick = e => { e.stopPropagation(); setZoom(1); };
$("zOut").onclick = e => { e.stopPropagation(); setZoom(-1); };
$("nextp").onclick = e => { e.stopPropagation(); go(page + 1); };
function go(p){ p = Math.min(604, Math.max(1, p)); if (p !== page) { page = p; render(); } }

// ---- Night mode ----
let theme = store.get("qtheme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $("bTheme").textContent = theme === "dark" ? "☀️" : "🌙";
  document.querySelector('meta[name=theme-color]').content = theme === "dark" ? "#111613" : "#FBF7EC";
}
$("bTheme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("qtheme", theme); applyTheme(); };
applyTheme();

// ---- Bookmarks ----
function marks(){ try { return JSON.parse(store.get("qmarks", "[]")) || []; } catch(_) { return []; } }
function markBtn(){ $("bMark").classList.toggle("on", marks().some(m => m.p === page)); }
$("bMark").onclick = () => {
  let m = marks();
  if (m.some(x => x.p === page)) { m = m.filter(x => x.p !== page); toast("حُذفت العلامة"); }
  else { m.unshift({p: page, t: Date.now()}); toast("حُفظت العلامة – صفحة " + AR(page)); }
  store.set("qmarks", JSON.stringify(m.slice(0, 50)));
  markBtn();
};

// ---- Index: surahs, parts, bookmarks ----
let tab = "s";
function fillList(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  let html = "";
  if (tab === "s") html = D.s.map(([n, p], i) => `<div class="s" data-p="${p}"><span>${AR(i+1)}. سورة ${n}</span><span>صفحة ${AR(p)}</span></div>`).join("");
  else if (tab === "j") {
    const first = {}; D.p.forEach((x, i) => { if (!first[x[1]]) first[x[1]] = i + 1; });
    html = Object.keys(first).map(j => `<div class="s" data-p="${first[j]}"><span>الجزء ${AR(j)}</span><span>صفحة ${AR(first[j])}</span></div>`).join("");
  } else {
    const m = marks();
    html = m.length ? m.map(x => `<div class="s" data-p="${x.p}"><span>🔖 سورة ${D.s[D.p[x.p-1][2]-1][0]}</span><span>صفحة ${AR(x.p)} <button class="x" data-del="${x.p}">✕</button></span></div>`).join("")
      : `<div class="empty">لا توجد علامات.<br>اضغط 🔖 في أعلى الصفحة لحفظ مكان القراءة.</div>`;
  }
  $("slist").innerHTML = html;
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.t; fillList(); } };
$("slist").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d) { e.stopPropagation(); store.set("qmarks", JSON.stringify(marks().filter(x => x.p !== +d.dataset.del))); fillList(); markBtn(); return; }
  const r = e.target.closest(".s"); if (r) { go(+r.dataset.p); $("list").hidden = true; }
});

// ---- Turning pages ----
// Swipe right for the next page, left for the previous, like a paper mushaf
let x0 = null, y0 = null, moved = false;
addEventListener("touchstart", e => { if (e.touches.length > 1) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, {passive:true});
addEventListener("touchmove", () => { moved = true; }, {passive:true});
addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  const v = $("view"), wide = v.scrollWidth > v.clientWidth + 2;
  if ($("list").hidden && !wide && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { go(page + (dx > 0 ? 1 : -1)); }
  x0 = null;
});
addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(page + 1); if (e.key === "ArrowRight") go(page - 1); });
$("bNext").onclick = () => go(page + 1);
$("bPrev").onclick = () => go(page - 1);
$("bList").onclick = () => { fillList(); $("list").hidden = false; };
$("close").onclick = () => $("list").hidden = true;
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (D && $("msg").style.display === "none") layout(); }, 120); });

fetch("mushaf.json").then(r => r.json()).then(j => { D = j; render(); })
  .catch(() => { $("msg").innerHTML = "تعذر تحميل المصحف.<br>تأكد من الإنترنت."; });
</script>
