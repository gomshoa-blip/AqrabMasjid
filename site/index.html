<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--green);color:#fff;padding:16px 14px 14px;text-align:center;position:relative}
  .lang{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 12px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
  .lang.inst2{inset-inline-start:auto;inset-inline-end:10px}
  header h1{padding:0 78px}
  header h1{margin:0;font-size:clamp(1.2rem,5.4vw,1.5rem);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
  header h1 svg{width:1.15em;height:1.15em}
  .wrap{max-width:720px;margin:0 auto;padding:12px}
  .pt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .next{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .next .lbl{align-self:flex-start;color:var(--ink);font-size:1rem;font-weight:700}
  .next .name{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:10px;color:var(--green);line-height:1.2}
  .next .pn{font-size:2rem;font-weight:800}
  .next .tm{font-size:1.5rem;font-weight:800;color:var(--ink)}
  .clk{display:inline-block;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:1.25em;letter-spacing:.5px;margin-inline-start:6px}
  .next .left{font-size:1.15rem;font-weight:800;background:var(--soft);color:var(--green);border-radius:10px;padding:6px 10px;white-space:nowrap}
  .times{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;text-align:center}
  .times div{background:var(--bg);border-radius:10px;padding:6px 2px;font-size:.82rem}
  .times b{display:block;font-size:.95rem}
  .times .on{background:var(--green);color:#fff;box-shadow:0 0 0 2px var(--gold)}
  .meta{color:var(--ink);font-size:.95rem;font-weight:700;margin-top:10px;text-align:center}
  .big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:1.2rem;font-weight:800;
    background:var(--green2);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
  .big.go1{font-size:1.3rem;padding:18px}
  .big.jami{background:#8a6a2c;margin-top:10px;font-size:1.2rem}
  .big[aria-disabled=true]{opacity:.6;pointer-events:none}
  .alt{background:var(--soft);color:var(--dark);border:0;font-size:1rem;margin-top:8px}
  .status{text-align:center;color:var(--muted);font-size:.95rem;margin:8px 0;min-height:1.3em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}

  .card h3{margin:0;font-size:1.02rem}
  .card .d{color:var(--muted);font-size:.9rem}
  .go{flex:none;background:var(--green);color:#fff;text-decoration:none;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}

  .safe{background:#fff7e6;border:1px solid #f0d9a8;border-radius:12px;padding:10px 12px;font-size:.92rem;margin:12px 0}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
  .box h2{margin:0 0 6px;font-size:1.1rem;color:var(--green)}
  .wa{background:#25D366;margin-top:10px}
  .inst{background:var(--green);margin-top:12px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:999}

  .times small{display:block;font-size:.72rem;color:var(--muted);margin-top:1px;white-space:nowrap}
  .times b{white-space:nowrap}

  .times .on small{color:#fff}
  .link{display:block;margin:6px auto 0;background:none;border:0;color:var(--green);font:inherit;font-size:.9rem;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
  .link[hidden]{display:none}
  .share{background:var(--green2);margin-top:12px}
  .qr{background:#fff;color:var(--ink);border:2px solid var(--line);margin-top:10px;font-size:1.05rem}
  .sheet{max-height:92vh;overflow:auto}
  .sheet p{margin:0 0 12px;color:var(--muted)}
  .sheet label{display:block;font-weight:700;margin:10px 0 4px}
  .sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}

  .sheet .two{display:flex;gap:8px;margin-top:14px}
  .sheet .two .big{flex:1;margin:0}

  .fmapL{font-size:.9rem;color:var(--muted);margin-top:8px}

  .iostip span{flex:1}
  .iostip button{background:#fff;color:var(--green);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:800}
  .big.donate{display:block;text-align:center;background:var(--soft);color:var(--dark);font-size:1rem;margin-top:8px}
  .donNote{font-size:.8rem;color:var(--muted);text-align:center;margin:-4px 0 10px}
  /* Hero card: next prayer + countdown ring (last 30 min) */
  .hero{background:var(--green);color:#fff;border:0;border-radius:18px;position:relative;padding:44px 14px 16px}
  .hero .lang{top:10px;transform:none;inset-inline-start:10px;inset-inline-end:auto}
  .hero .lbl{color:#DDEFE7;font-size:1.05rem;font-weight:700;text-align:center}
  .hero .pn{font-size:2.6rem;font-weight:800;text-align:center;line-height:1.25}
  .hero .ptm{font-size:2.2rem;font-weight:800;color:var(--gold);text-align:center}
  .ringwrap{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:6px auto 0}
  .ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ringwrap .trk{fill:none;stroke:rgba(255,255,255,.2);stroke-width:9}
  .ringwrap .arc{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
  .ringwrap.after .arc{stroke:#7FD3AE}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14%}
  .ringtxt .r1{font-size:.95rem;color:#DDEFE7}
  .ringtxt .r2{font-size:1.7rem;font-weight:800}
  .ringtxt .r3{font-size:2.3rem;font-weight:800;color:var(--gold);line-height:1.2}
  .ringwrap.after .r3{color:#7FD3AE}
  .ringtxt .r3 .clk{font-size:1em;margin:0}
  .ringtxt .r4{font-size:.95rem;color:#DDEFE7}
  .hero .iq{background:rgba(255,255,255,.12);border:0;color:#fff}
  .hero .iq.now{background:rgba(255,255,255,.2)}
  [hidden]{display:none!important}
  .big.go1{background:var(--gold);color:#111;font-size:1.4rem;padding:20px}
  .ayah{background:var(--green);color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:1.15rem;font-weight:700;line-height:1.9;margin-bottom:10px}
  .row2{display:flex;gap:10px}
  .row2 .big{flex:1;margin-top:8px}
  .waC{background:#1DA851;color:#fff;margin-top:10px}
  /* Adhkar */
  .tabs{display:flex;gap:6px;margin:6px 0 10px}
  .tabs button{flex:1;border:0;border-radius:12px;padding:10px 4px;font:inherit;font-weight:800;background:var(--soft);color:var(--dark);cursor:pointer}
  .tabs button.on{background:var(--green);color:#fff}
  .dk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .dk p{margin:0 0 8px;color:var(--ink);font-size:1.08rem;line-height:1.9;white-space:pre-line}
  .dk .cnt{background:var(--soft);color:var(--dark);border-radius:10px;padding:7px;text-align:center;font-weight:800}
  .dk.done{opacity:.75}.dk.done .cnt{background:var(--green);color:#fff}
  .dkSrc{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 12px}
</style>
</head>

let ptTimer = null;
function prayerTimes(lat, lng, labelKey){
  if (!window.adhan) return;
  ptArgs = [lat, lng, labelKey];
  // Qirat link: show only when the user's location is in Riyadh (about 70 km from the center)
  const qb = document.getElementById("goQirat");
  if (qb) { const dR = Math.hypot((lat-24.7136)*111, (lng-46.6753)*101); qb.style.display = (labelKey === "byLoc" && dR < 70) ? "" : "none"; }
  const mt = pickMethod(labelKey === "byLoc");
  saudi = labelKey !== "byLoc" || deviceTZ() === "Asia/Riyadh";
  $("iqSet").hidden = saudi;
  const params = adhan.CalculationMethod[mt.m]();
  if (mt.hanafi) params.madhab = adhan.Madhab.Hanafi;
  const coords = new adhan.Coordinates(lat, lng);
  const now = new Date();
  const make = d => {
    const pt = new adhan.PrayerTimes(coords, d, params);
    // Umm Al-Qura: Isha is 2 hours after Maghrib in Ramadan (90 minutes the rest of the year)
    if (mt.m === "UmmAlQura" && isRamadan(d)) pt.isha = new Date(pt.maghrib.getTime() + 120*60000);
    return pt;
  };
  const today = make(now);
  const plus = (t, k) => new Date(t.getTime() + iqDelay(k)*60000);
  const render = () => {
    const n = new Date();
    let key = today.nextPrayer(n), t;
    if (key === "sunrise") key = "dhuhr";
    if (key === "none") { // after Isha -> tomorrow's Fajr
      const tm = new Date(n); tm.setDate(tm.getDate()+1);
      key = "fajr"; t = make(tm).fajr;
    } else t = today[key];
    const cur = today.currentPrayer(n);
    const fri = n.getDay() === 5;                       // Friday: Dhuhr becomes Jumuah
    const nameOf = k => (fri && k === "dhuhr") ? L().jumua : L().names[k];
    const isJ = k => fri && k === "dhuhr";
    // Current prayer: from adhan until 30 min after adhan (or 5 min after iqama if later)
    const curT = (cur && cur !== "sunrise" && today[cur] instanceof Date) ? today[cur] : null;
    const since = curT ? (n - curT) : -1;
    const curIq = curT ? plus(curT, cur) : null;
    const nowMode = since >= 0 && (since < 30*60000 || n < curIq.getTime() + 5*60000);
    const hl = nowMode ? cur : key;
    notifTick(key, t, nowMode ? cur : null, curT, n, nameOf);
    const W = 30*60000, C = 326.73;
    const ringOn = (top, name, big, bottom, prog, after) => {
      $("plain").hidden = true; $("ringWrap").hidden = false; $("heroLbl").textContent = "";
      $("ringWrap").classList.toggle("after", after);
      $("r1").textContent = top; $("r2").textContent = name; $("r3").innerHTML = big; $("r4").textContent = bottom;
      $("arc").setAttribute("stroke-dashoffset", (C * (1 - Math.max(0, Math.min(1, prog)))).toFixed(1));
    };
    const plainOn = (lbl, name, timeTxt) => {
      $("ringWrap").hidden = true; $("plain").hidden = false;
      $("heroLbl").textContent = lbl; $("pName").textContent = name; $("pTime").textContent = timeTxt;
    };
    const iq = $("iq"); iq.className = "iq"; iq.textContent = "";
    if (nowMode && isJ(cur)) {
      plainOn(L().curLbl, nameOf(cur), fmt(curT));
      iq.className = "iq now"; iq.textContent = L().jumuaNow;
    } else if (nowMode) {
      const ls = curIq - n;
      if (ls > 0) {
        const s2 = Math.floor(ls/1000);
        ringOn(L().adhanDone, nameOf(cur), clk([Math.floor(s2/3600), Math.floor(s2/60)%60, s2%60]), L().iqAt(fmt(curIq)), ls/(curIq-curT), true);
      } else {
        ringOn("", nameOf(cur), L().iqStarted, L().iqAt(fmt(curIq)), 1, true);
      }
    } else {
      const left = t - n;
      const nm2 = (isJ(key) && t.getDate() === n.getDate()) ? L().jumua : L().names[key];
      if (left > W) plainOn(L().nextLbl, nm2, L().adhanAt(fmt(t)));
      else {
        const s2 = Math.max(0, Math.floor(left/1000));
        ringOn(L().leftTo, nm2, clk([Math.floor(s2/3600), Math.floor(s2/60)%60, s2%60]), L().adhanAt(fmt(t)), left/W, false);
      }
      // Below: only the iqama time (the adhan time is already shown above)
      if (isJ(key) && t.getDate() === n.getDate()) iq.textContent = L().jumuaNext(fmt(t));
      else iq.textContent = L().iqAt(fmt(new Date(t.getTime() + iqDelay(key)*60000)));
    }
    $("ayah").textContent = AYAH[hl] || "";
    $("times").innerHTML = ORDER.map(k => `<div class="${k===hl ? 'on':''}">${nameOf(k)}<b>${fmt(today[k])}</b><small>${isJ(k) ? L().khutba : L().iqShort + " +" + iqDelay(k) + " " + L().min}</small></div>`).join("");
    let hijri = "";
    try { hijri = new Intl.DateTimeFormat((lang==="ar"?"ar-SA":"en-US")+"-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(n); } catch(_){}
    $("ptMeta").textContent = (hijri ? hijri + " · " : "") + L()[labelKey] + " · " + L().method + " " + L().methods[mt.m];
  };
  render();
  clearInterval(ptTimer); ptTimer = setInterval(render, 1000);
}

function km(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const dir = m => `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=driving`;
const distTxt = d => d < 1 ? Math.round(d*1000) + " " + L().m : d.toFixed(1) + " " + L().km;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ENDPOINTS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
async function overpass(lat, lng, r, f = ""){
  const q = `[out:json][timeout:15];(node["amenity"="place_of_worship"]["religion"="muslim"]${f}(around:${r},${lat},${lng});way["amenity"="place_of_worship"]["religion"="muslim"]${f}(around:${r},${lat},${lng}););out center 80;`;
  const one = async ep => {
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 12000);
    try{
      const res = await fetch(ep + "?data=" + encodeURIComponent(q), {signal:ctl.signal});
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      return j.elements.map(e => {
        const lt = e.lat ?? e.center?.lat, lg = e.lon ?? e.center?.lon, t = e.tags || {};
        return {lat:lt, lng:lg, ar: t["name:ar"] || t.name || "", en: t["name:en"] || t.name || "", d: km(lat,lng,lt,lg)};
      }).filter(m => m.lat);
    } finally { clearTimeout(to); }
  };
  return Promise.any(ENDPOINTS.map(one));
}
const nm = m => m[lang] || m.ar || m.en || L().mosque;
function setStatus(k, ...a){ statusKey = [k, ...a]; const v = L()[k]; $("status").textContent = typeof v === "function" ? v(...a) : v; }

$("addForm").addEventListener("submit", async e => {

  { const la = +$("fLat").value, lo = +$("fLng").value;

  $("fSend").disabled = true; $("fSend").textContent = L().fSending; fMsg("");
  try {
    const res = await fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams(new FormData(f)).toString()});
    if (!res.ok) throw new Error(res.status);
    track("add_mosque_submit");
    fMsg("fThanks", "ok"); f.reset(); resetLoc();
    setTimeout(() => { $("addModal").hidden = true; }, 2500);
  } catch(_) { fMsg("fErr", "err"); }
  $("fSend").disabled = false; $("fSend").textContent = L().fSend;
});

function dkShow(name){
  document.querySelectorAll("#dkTabs button").forEach(b => b.classList.toggle("on", b.textContent === name));
  const box = $("dkList"); box.innerHTML = "";
  DK[name].forEach(([txt, cnt]) => {
    let left = cnt;
    const c = document.createElement("div"); c.className = "dk";
    const p = document.createElement("p"); p.textContent = txt;
    const k = document.createElement("div"); k.className = "cnt";
    const show = () => { k.textContent = left > 0 ? (cnt === 1 ? "مرة واحدة · اضغط عند الانتهاء" : "المتبقي: " + left + " من " + cnt + " · اضغط للعد") : "✓ تم"; c.classList.toggle("done", left === 0); };
    c.addEventListener("click", () => { if (left > 0) { left--; show(); } });
    show(); c.appendChild(p); c.appendChild(k); box.appendChild(c);
  });
}
